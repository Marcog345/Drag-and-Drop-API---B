<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quadro de Estudos - Enem e Provas Finais</title>
  <link rel="stylesheet" href="style.css">
  <!-- Ícones Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header>
    <h1><i class="fa-solid fa-graduation-cap"></i> Planeamento de Estudos</h1>
    <p>Organiza as tuas tarefas para o Enem e Provas Finais[cite: 1]</p>
  </header>

  <div class="container">
    <!-- Formulário para adicionar nova tarefa -->
    <section class="add-task-section">
      <h2><i class="fa-solid fa-plus"></i> Nova Tarefa</h2>
      <form id="task-form">
        <input type="text" id="task-title" placeholder="Ex: Redação do Enem, Estudar Física (Óptica)..." required>
        <select id="task-tag">
          <option value="Geral">Geral</option>
          <option value="Redação">Redação</option>
          <option value="Exatas">Exatas</option>
          <option value="Humanas">Humanas</option>
          <option value="Biológicas">Biológicas</option>
          <option value="Línguas">Línguas</option>
        </select>
        <button type="submit"><i class="fa-solid fa-plus-circle"></i> Adicionar Card</button>
      </form>
    </section>

    <!-- Quadro Kanban -->
    <main class="board">
      
      <!-- Coluna: A Fazer -->
      <div class="column" data-column="todo">
        <div class="column-header">
          <h3><i class="fa-regular fa-file-lines"></i> A Fazer</h3>
          <span class="count" id="count-todo">0</span>
        </div>
        <div class="cards-container" id="todo"></div>
      </div>

      <!-- Coluna: Em Andamento -->
      <div class="column" data-column="in-progress">
        <div class="column-header">
          <h3><i class="fa-solid fa-rocket"></i> Em Andamento</h3>
          <span class="count" id="count-in-progress">0</span>
        </div>
        <div class="cards-container" id="in-progress"></div>
      </div>

      <!-- Coluna: Concluído -->
      <div class="column" data-column="done">
        <div class="column-header">
          <h3><i class="fa-solid fa-square-check"></i> Concluído</h3>
          <span class="count" id="count-done">0</span>
        </div>
        <div class="cards-container" id="done"></div>
      </div>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
